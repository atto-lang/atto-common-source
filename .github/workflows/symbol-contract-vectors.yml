name: Symbol contract vectors
on:
  pull_request:
    paths:
      - "docs/SYMBOLS.md"
      - "fixtures/symbols.v1.json"
      - "tests/test_symbol_contract_vectors.py"
      - ".github/workflows/symbol-contract-vectors.yml"
  push:
    paths:
      - "docs/SYMBOLS.md"
      - "fixtures/symbols.v1.json"
      - "tests/test_symbol_contract_vectors.py"
      - ".github/workflows/symbol-contract-vectors.yml"
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-check Symbol contract data (not a backend compiler test)
        run: python3 -m unittest discover -s tests -p 'test_symbol_contract_vectors.py' -v
