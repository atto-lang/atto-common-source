name: Symbol contract vectors
on:
  pull_request:
    paths:
      - "docs/SYMBOLS.md"
      - "docs/SYMBOLS_SHARED_RO_V1.md"
      - "fixtures/symbols.v1.json"
      - "fixtures/symbols-shared-ro-v1.json"
      - "fixtures/symbols-shared-ro-v1/**"
      - "fixtures/symbol-key-wire.v1.json"
      - "tests/test_symbol_contract_vectors.py"
      - "tests/test_symbol_key_model.py"
      - "tests/test_symbol_key_wire_vectors.py"
      - "tests/test_symbol_shared_ro_model.py"
      - ".github/workflows/symbol-contract-vectors.yml"
  push:
    paths:
      - "docs/SYMBOLS.md"
      - "docs/SYMBOLS_SHARED_RO_V1.md"
      - "fixtures/symbols.v1.json"
      - "fixtures/symbols-shared-ro-v1.json"
      - "fixtures/symbols-shared-ro-v1/**"
      - "fixtures/symbol-key-wire.v1.json"
      - "tests/test_symbol_contract_vectors.py"
      - "tests/test_symbol_key_model.py"
      - "tests/test_symbol_key_wire_vectors.py"
      - "tests/test_symbol_shared_ro_model.py"
      - ".github/workflows/symbol-contract-vectors.yml"
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked source and run attempt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_HEAD_SHA=$EXPECTED_HEAD"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "EXACT_RUN_ATTEMPT=${{ github.run_attempt }}"
      - name: Verify Symbol reference contracts and pinned guest source identities
        run: python3 -m unittest discover -s tests -p 'test_symbol_*.py' -v
