name: Modern networking native Atto source audit (not guest execution)
on:
  pull_request:
    paths:
      - 'stdlib/net/**'
      - 'contracts/modern-networking-v1.json'
      - 'docs/MODERN_NETWORKING.md'
      - 'tests/test_modern_networking_contract.py'
      - '.github/workflows/modern-networking-source.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4 pinned
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify source contract (NOT a guest HTTP/3 run)
        run: python3 -m unittest discover -s tests -p 'test_modern_networking_contract.py' -v
