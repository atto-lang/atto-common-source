name: Actor transfer contract reference tests
on:
  push:
    paths:
      - 'contracts/v1/actor-transfer/**'
      - '.github/workflows/actor-transfer-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actor-transfer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run 36 actor transfer matrix cases plus adversarial reference checks
        run: python3 contracts/v1/actor-transfer/verify.py -v
