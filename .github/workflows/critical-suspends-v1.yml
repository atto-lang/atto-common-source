name: Critical suspends v1 contract metadata
on:
  pull_request:
    paths:
      - 'contracts/v1/critical-suspends-v1/**'
      - 'tests/critical-suspends-v1.test.mjs'
      - '.github/workflows/critical-suspends-v1.yml'
  workflow_dispatch:
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate target-source manifest metadata (NOT guest execution)
        run: node --test tests/critical-suspends-v1.test.mjs
