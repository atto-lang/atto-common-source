name: Namespace source-free runner admission canary
on:
  pull_request:
    paths:
      - '.github/workflows/namespace-runner-admission-canary.yml'
  workflow_dispatch: {}
permissions: {}
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove runner executes commands without checkout or private source
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$GITHUB_RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'NAMESPACE_RUNNER_ADMISSION_EXECUTED repo=%s source_sha=%s run=%s attempt=%s runner=%s os=%s\n' \
            "$EXPECTED_REPOSITORY" "$EXPECTED_SHA" "$EXPECTED_RUN_ID" \
            "$EXPECTED_RUN_ATTEMPT" "$RUNNER_NAME" "$RUNNER_OS"
          echo "SOURCE_FREE_CANARY=EXECUTED_NOT_COMPILER_OR_GUEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent GitHub API evidence must confirm runner_id > 0 and executed steps." >> "$GITHUB_STEP_SUMMARY"
