name: std.test v1 reference (host-only)
on:
  push:
    paths:
      - 'reference/test_harness_v1.mjs'
      - 'reference/test_property_v1.mjs'
      - 'reference/test_reporters_v1.mjs'
      - 'stdlib/test.atto'
      - 'fixtures/pure-suite.atto'
      - 'fixtures/filter-fail-fast.atto'
      - 'contracts/test-core-guest-candidates-v1.json'
      - 'docs/TEST_FRAMEWORK_COMPARISON.md'
      - 'tests/test_harness_v1.test.mjs'
      - 'tests/test_harness_hardening_v1.test.mjs'
      - 'tests/test_property_v1.test.mjs'
      - 'tests/test_reporters_v1.test.mjs'
      - 'tests/test_core_guest_registry_v1.test.mjs'
      - 'tests/test_harness_manifest_v1.test.mjs'
      - 'contracts/test-harness-v1.json'
      - '.github/workflows/test-harness-v1.yml'
  pull_request:
    paths:
      - 'reference/test_harness_v1.mjs'
      - 'reference/test_property_v1.mjs'
      - 'reference/test_reporters_v1.mjs'
      - 'stdlib/test.atto'
      - 'fixtures/pure-suite.atto'
      - 'fixtures/filter-fail-fast.atto'
      - 'contracts/test-core-guest-candidates-v1.json'
      - 'docs/TEST_FRAMEWORK_COMPARISON.md'
      - 'tests/test_harness_v1.test.mjs'
      - 'tests/test_harness_hardening_v1.test.mjs'
      - 'tests/test_property_v1.test.mjs'
      - 'tests/test_reporters_v1.test.mjs'
      - 'tests/test_core_guest_registry_v1.test.mjs'
      - 'tests/test_harness_manifest_v1.test.mjs'
      - 'contracts/test-harness-v1.json'
      - '.github/workflows/test-harness-v1.yml'
permissions:
  contents: read
jobs:
  source_only_reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head and clean tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute host-only reference semantics
        run: node --test tests/test_harness_v1.test.mjs tests/test_harness_hardening_v1.test.mjs tests/test_property_v1.test.mjs tests/test_reporters_v1.test.mjs tests/test_harness_manifest_v1.test.mjs tests/test_core_guest_registry_v1.test.mjs
      - name: Distinguish reference model from compiled guest support
        run: |
          echo 'ATTO_TEST_HARNESS_REFERENCE_ONLY=1'
          echo 'ATTO_GUEST_EXECUTION=NOT_EXECUTED'
          echo 'ATTO_BACKEND_PARITY=NOT_CERTIFIED'
