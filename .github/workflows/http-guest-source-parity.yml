name: Shared JVM LLVM guest source identity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fixture-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test Rust guest fixture identity gate
        run: cargo test --manifest-path tools/http-fixture-identity/Cargo.toml
      - name: Verify canonical guest source blob
        run: cargo run --manifest-path tools/http-fixture-identity/Cargo.toml -- --root .
