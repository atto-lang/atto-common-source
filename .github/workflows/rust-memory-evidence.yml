name: Rust memory evidence
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Format Rust memory evidence gate
        run: cargo fmt --manifest-path tools/memory-evidence/Cargo.toml -- --check
      # Resolve and fetch dependencies explicitly on the hosted runner before
      # the offline-only lint/test phases. Never turn a missing cache into a pass.
      - name: Prepare Cargo dependency cache
        run: cargo fetch --manifest-path tools/memory-evidence/Cargo.toml
      - name: Lint Rust memory evidence gate
        run: cargo clippy --offline --locked --manifest-path tools/memory-evidence/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust memory evidence gate
        run: cargo test --offline --locked --manifest-path tools/memory-evidence/Cargo.toml
