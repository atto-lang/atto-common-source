name: common contracts

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python contract tests still awaiting Rust migration
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Unsafe G0 receipt rejection and provenance harness (non-certifying)
        run: python3 -m unittest discover -s scripts -p 'test_verify_unsafe_g0_receipts.py' -v
      - name: Compile remaining Python contract tools
        run: python3 -m py_compile scripts/*.py
      - name: Verify String/CString ABI v1 reference contract
        run: node tests/verify-string-abi-v1.mjs
      - name: Format and lint Rust IPC models
        run: |
          cargo fmt --manifest-path tools/ipc-models/Cargo.toml -- --check
          cargo clippy --offline --manifest-path tools/ipc-models/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust IPC receipt and delivery models
        run: cargo test --offline --manifest-path tools/ipc-models/Cargo.toml
      - name: Format and lint Rust recovery register gate
        run: |
          cargo fmt --manifest-path tools/recovery-register/Cargo.toml -- --check
          cargo clippy --offline --manifest-path tools/recovery-register/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust recovery register integrity gate
        run: cargo test --offline --manifest-path tools/recovery-register/Cargo.toml
      - name: Check fifty-item recovery register integrity (not live issues)
        run: cargo run --offline --manifest-path tools/recovery-register/Cargo.toml
