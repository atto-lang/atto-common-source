name: Universal hot load ABI v1 source-free conformance
on:
  pull_request:
    paths:
      - 'contracts/v1/hot-load-abi/**'
      - '.github/workflows/hot-load-abi-v1.yml'
  push:
    paths:
      - 'contracts/v1/hot-load-abi/**'
      - '.github/workflows/hot-load-abi-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcefree-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tree and C/C++ host ABI header
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -n "$(git rev-parse HEAD^{tree})"
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c contracts/v1/hot-load-abi/ores_hot_load_v1.h
          clang -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c contracts/v1/hot-load-abi/ores_hot_load_v1.h
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c++ contracts/v1/hot-load-abi/ores_hot_load_v1.h
      - name: Execute source-free-only state oracle three times
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          for round in 1 2 3; do
            python3 -I -B contracts/v1/hot-load-abi/verify.py >"$RUNNER_TEMP/uhl-$round.log" 2>&1
            grep -q '^Ran 41 tests in' "$RUNNER_TEMP/uhl-$round.log"
            grep -qx 'OK' "$RUNNER_TEMP/uhl-$round.log"
            if grep -Eq 'FAILED|skipped|expected failure|unexpected success' "$RUNNER_TEMP/uhl-$round.log"; then
              cat "$RUNNER_TEMP/uhl-$round.log"
              exit 1
            fi
            echo "UHL_SOURCEFREE_ROUND_${round}=PASS_41"
          done
      - name: Emit narrow evidence receipt (not native parity)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(("git", *args), text=True).strip()

          if git("rev-parse", "HEAD") != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("head changed")
          root = Path("contracts/v1/hot-load-abi")
          sources = [root / "README.md", root / "ores_hot_load_v1.h",
                     root / "verify.py", Path(".github/workflows/hot-load-abi-v1.yml")]
          for p in sources:
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("invalid or absent source path: " + str(p))
          records = []
          for i in (1, 2, 3):
              data = (Path(os.environ["RUNNER_TEMP"]) / f"uhl-{i}.log").read_bytes()
              if b"Ran 41 tests in" not in data or b"\nOK\n" not in data:
                  raise SystemExit("missing executed source-free test receipts")
              records.append(hashlib.sha256(data).hexdigest())
          receipt = {
              "schema": "oreslang.hotload.uhl1.sourcefree/v1",
              "head_sha": git("rev-parse", "HEAD"),
              "tree_sha": git("rev-parse", "HEAD^{tree}"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_git_blobs": {str(p): git("hash-object", str(p)) for p in sources},
              "round_sha256": records,
              "executed_reference_model_cases": 123,
              "c11_gcc_clang_and_cpp17_syntax_checked": True,
              "source_free_only": True,
              "compiler_executed": False,
              "actual_oreslang_guest_executed": False,
              "abi_adapter_loaded": False,
              "supervisor_or_ets_runtime_verified": False,
              "production_hot_load_certified": False
          }
          (Path(os.environ["RUNNER_TEMP"]) / "uhl-v1-sourcefree.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload source-free receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uhl-v1-sourcefree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uhl-v1-sourcefree.json
          if-no-files-found: error
          retention-days: 7
