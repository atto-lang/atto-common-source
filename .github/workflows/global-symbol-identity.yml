name: Global symbol identity v1 contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-symbol-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify global symbol contract and vectors
        run: node --test tests/global-symbol-identity.test.mjs
