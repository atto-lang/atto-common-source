name: Annotation admission reference (not guest conformance)

on:
  pull_request:
    paths:
      - 'contracts/annotation-targets-v2.json'
      - 'contracts/ANNOTATION_TARGETS_V2.md'
      - 'reference/annotation_admission.py'
      - 'reference/test_annotation_admission.py'
      - '.github/workflows/annotation-admission-reference.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/annotation-targets-v2.json'
      - 'contracts/ANNOTATION_TARGETS_V2.md'
      - 'reference/annotation_admission.py'
      - 'reference/test_annotation_admission.py'
      - '.github/workflows/annotation-admission-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate annotation registry and reference admission (NOT guest AOT)
        run: python3 -m unittest discover -s reference -p 'test_annotation_admission.py' -v
