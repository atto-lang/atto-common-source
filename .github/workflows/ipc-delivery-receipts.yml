name: IPC delivery receipt reference checks
on:
  pull_request:
    paths:
      - 'tools/ipc-models/**'
      - '.github/workflows/ipc-delivery-receipts.yml'
  push:
    branches:
      - 'draft/issue-wave30-ipc-current-20261018'
permissions:
  contents: read
jobs:
  reference-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute IPC receipt reference and randomized tests
        run: cargo test --offline --manifest-path tools/ipc-models/Cargo.toml
      - name: Assert reference-only evidence classification
        run: |
          echo 'REFERENCE_ONLY: not a compiler/transport/native parity certificate'
