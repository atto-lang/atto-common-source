name: Scoped visibility contract (source-free)

on:
  pull_request:
    paths:
      - '.github/workflows/package-visibility-contract.yml'
      - 'contracts/package-visibility-multifile-v1.json'
      - 'scripts/verify_package_visibility_contract.py'
      - 'scripts/test_package_membership_reference.py'
      - 'docs/PACKAGE_VISIBILITY_AND_MULTIFILE_V1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-visibility-contract.yml'
      - 'contracts/package-visibility-multifile-v1.json'
      - 'scripts/verify_package_visibility_contract.py'

permissions:
  contents: read

jobs:
  scoped-visibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Python standard-library contract verifier
        run: python3 scripts/verify_package_visibility_contract.py
      - name: Run source-free filesystem membership reference tests
        run: python3 scripts/test_package_membership_reference.py
