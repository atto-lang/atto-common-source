name: AttoLang generated-declaration macro source contract (not AOT certification)

on:
  pull_request:
    paths:
      - 'fixtures/macro-declaration-aot-v1/**'
      - 'tests/macro-declaration-aot-v1.test.mjs'
      - '.github/workflows/macro-declaration-aot-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_MACRO_DECL_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_MACRO_DECL_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Check static contract, fixture Git blob SHA and evidence policy
        run: node --test tests/macro-declaration-aot-v1.test.mjs
      - name: No executable guest certification from source-only tests
        run: echo 'ATTO_MACRO_DECL_NATIVE_AOT_GUEST=NOT_EXECUTED'
