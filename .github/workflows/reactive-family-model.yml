name: Reactive family contract model (host only)
on:
  pull_request:
    paths:
      - 'docs/REACTIVE_ITERATOR_STREAM_CHANNEL_INTEROP_V1.md'
      - 'tests/test_reactive_family_protocol_model.py'
      - '.github/workflows/reactive-family-model.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/REACTIVE_ITERATOR_STREAM_CHANNEL_INTEROP_V1.md'
      - 'tests/test_reactive_family_protocol_model.py'
      - '.github/workflows/reactive-family-model.yml'
permissions:
  contents: read
jobs:
  protocol-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Contract model only (NOT Oreslang execution evidence)
        run: python3 -m unittest discover -s tests -p 'test_reactive_family_protocol_model.py' -v
