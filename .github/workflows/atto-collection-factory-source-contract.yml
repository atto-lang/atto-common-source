# SOURCE-ONLY validation. This is not a backend compiler/guest CI run.
name: Atto collection Type.of source-only contract
on:
  pull_request:
    paths:
      - ".github/workflows/atto-collection-factory-source-contract.yml"
      - "contracts/v1/ATTO_CORE_COLLECTION_OF_FACTORIES_V1.md"
      - "fixtures/collection-of-factories-v1/**"
      - "tools/check_collection_of_factories_v1.py"
      - "tools/tests/test_collection_of_factories_v1.py"
  push:
    paths:
      - ".github/workflows/atto-collection-factory-source-contract.yml"
      - "contracts/v1/ATTO_CORE_COLLECTION_OF_FACTORIES_V1.md"
      - "fixtures/collection-of-factories-v1/**"
      - "tools/check_collection_of_factories_v1.py"
      - "tools/tests/test_collection_of_factories_v1.py"
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch; no credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Manifest structural and false-evidence validation
        run: python3 -B tools/check_collection_of_factories_v1.py
      - name: Six adversarial source-only mutation checks
        run: python3 -B -m unittest discover -s tools/tests -p test_collection_of_factories_v1.py -v
      - name: Preserve evidence classification
        run: |
          echo "SOURCE_EXPECTATIONS_ONLY: no AttoLang compiler or guest executed"
          echo "BACKEND_PARITY=NOT_CERTIFIED"
