name: Scalar source-linked SMT pilot
on:
  pull_request:
    paths:
      - 'scripts/verify_scalar_subset.mjs'
      - 'tests/verify_scalar_subset.test.mjs'
      - 'tests/verify_scalar_subset_integration.test.mjs'
      - 'tests/fixtures/stdlib-core-reviewed.ores'
      - 'formal/scalar-refinement/**'
      - '.github/workflows/scalar-source-smt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact reviewed private Java core blob
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git hash-object tests/fixtures/stdlib-core-reviewed.ores)" = "d2cd9b8e0cd3e3bb3ee6a5f9cebf9ab3312c44f4"
      - name: Install Z3 only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          z3 -version
          sha256sum "$(command -v z3)"
      - name: Fail-closed parser and solver oracle tests
        run: |
          set -euo pipefail
          node --version
          node --test tests/verify_scalar_subset.test.mjs
          node --test tests/verify_scalar_subset_integration.test.mjs
      - name: Prove actual imported source subset (not typed compiler IR)
        run: |
          set -euo pipefail
          node scripts/verify_scalar_subset.mjs --check min_int tests/fixtures/stdlib-core-reviewed.ores
          node scripts/verify_scalar_subset.mjs --check max_int tests/fixtures/stdlib-core-reviewed.ores
