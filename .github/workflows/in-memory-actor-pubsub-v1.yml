name: In-memory actor PubSub v1 contract catalog
on:
  pull_request:
    paths:
      - 'docs/IN_MEMORY_ACTOR_PUBSUB_V1.md'
      - 'fixtures/in-memory-actor-pubsub-v1.json'
      - 'tests/in-memory-actor-pubsub-v1.contract.test.mjs'
      - '.github/workflows/in-memory-actor-pubsub-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout is exact
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
      - name: Run contract-catalog checks only (not backend proof)
        run: |
          node --version
          node --test tests/in-memory-actor-pubsub-v1.contract.test.mjs
