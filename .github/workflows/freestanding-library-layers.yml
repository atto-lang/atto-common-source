name: Freestanding library layer admission (structural only)
on:
  push:
    branches: [main, 'audit/freestanding-library-guard-20261116']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit/tree
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit test dependency and import rules with negative mutations
        run: node --test tests/library-layers.test.mjs
      - name: Audit every canonical Atto source in the current tree
        run: node src/library-layers.mjs .
