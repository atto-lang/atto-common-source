name: named-multifile-module-contract
on:
  pull_request:
    paths:
      - 'contracts/named-module-multifile-js-v1.json'
      - 'tests/named-module-multifile-js-v1.test.mjs'
      - 'tests/named-module-sources.test.mjs'
      - 'fixtures/named-module-multifile-v1/**'
      - 'docs/NAMED_MODULE_MULTIFILE_JS_V1.md'
      - '.github/workflows/named-multifile-module-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Node runtime
        run: node --version
      - name: Execute reference-model and fixture-consistency checks
        run: node --test tests/named-module-multifile-js-v1.test.mjs tests/named-module-sources.test.mjs
