name: Rust shared integration manifest contract (static only)
on:
  pull_request:
    paths:
      - 'tools/integration-manifest/**'
      - '.github/workflows/rust-integration-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'tools/integration-manifest/**'
      - '.github/workflows/rust-integration-manifest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show Rust host tools
        run: |
          rustc --version
          cargo --version
      - name: Run all seven backend manifest policy vectors and malformed input tests
        run: cargo test --manifest-path tools/integration-manifest/Cargo.toml
