name: Rust shared integration manifest contract (static only)
on:
  pull_request:
    paths:
      - 'tools/integration-manifest/**'
      - '.github/workflows/rust-integration-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'tools/integration-manifest/**'
      - '.github/workflows/rust-integration-manifest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Establish exact reviewed checkout identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'EXACT_SOURCE_SHA=%s\n' "$actual"
          git rev-parse 'HEAD^{tree}'
      - name: Show Rust host tools
        run: |
          rustc --version
          cargo --version
      - name: Run all seven backend manifest policy vectors and malformed input tests
        run: cargo test --manifest-path tools/integration-manifest/Cargo.toml
