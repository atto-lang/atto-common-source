name: Type and ADT contract (source-free)
on:
  pull_request:
    paths:
      - "contracts/v1/type-adt/**"
      - "docs/TYPE_ADT_DECLARATION_HARDENING_V1.md"
      - "tests/type-adt-contract.test.mjs"
      - ".github/workflows/type-adt-contract.yml"
  push:
    paths:
      - "contracts/v1/type-adt/**"
      - "docs/TYPE_ADT_DECLARATION_HARDENING_V1.md"
      - "tests/type-adt-contract.test.mjs"
      - ".github/workflows/type-adt-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-adt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate declaration inventory and finite/symbolic ADT oracle
        run: node --test tests/type-adt-contract.test.mjs
      - name: Evidence label
        if: always()
        run: echo "SOURCE_FREE_ONLY; guest_parser=NOT_EXECUTED; Java=NOT_VERIFIED; LLVM=NOT_VERIFIED; AOT=NOT_VERIFIED"
