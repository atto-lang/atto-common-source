name: M9 supervisor CONTROL and DATA conservation contract
on:
  push:
    branches: [feat/m9-supervisor-control-contract-20261115]
  pull_request:
    paths:
      - 'contracts/m9-supervisor-control-v1.json'
      - 'tests/test_m9_supervisor_control.py'
      - '.github/workflows/m9-supervisor-contract.yml'
permissions:
  contents: read
jobs:
  m9-control-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and execute supervisor CONTROL contract tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest discover -s tests -p 'test_m9_supervisor_control.py' -v
          echo M9_SUPERVISOR_CONTROL_CONTRACT_EXECUTED=PASS
      - name: Evidence limitations
        run: echo 'Schema only; executed guest -> supervisor requires M9 Rust/Worker real conformance'
