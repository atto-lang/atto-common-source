name: Authority boundary reference v1 (source-free only)
on:
  pull_request:
    paths:
      - '.github/workflows/authority-boundary-v1.yml'
      - 'scripts/authority_boundary_v1.py'
      - 'tests/test_authority_boundary_v1.py'
      - 'contracts/v1/authority-boundary-v1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-boundary-v1.yml'
      - 'scripts/authority_boundary_v1.py'
      - 'tests/test_authority_boundary_v1.py'
      - 'contracts/v1/authority-boundary-v1.json'
permissions:
  contents: read
jobs:
  source-free-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove checked out head is exact expected commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "Reference oracle commit: $EXPECTED_HEAD"
          echo "Reference oracle tree: $(git rev-parse 'HEAD^{tree}')"
      - name: Run authority and admission oracle (not backend parity)
        run: python3 -m unittest discover -s tests -p 'test_authority_boundary_v1.py' -v
