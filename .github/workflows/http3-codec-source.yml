name: Native Atto HTTP3 codec source and ABI contract audit
on:
  pull_request:
    paths: ['stdlib/net/**', 'contracts/http3-*.json', 'tests/test_http3_codec_contract.py', '.github/workflows/http3-codec-source.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-atto-http3-codec-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind checks to exact commit
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Verify exact native Atto source and bounded executed evidence
        run: python3 -m unittest discover -s tests -p 'test_http3_codec_contract.py' -v
