name: Rust incremental query reference
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incremental-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --manifest-path tools/incremental-query-reference/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/incremental-query-reference/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/incremental-query-reference/Cargo.toml --all-targets --verbose
