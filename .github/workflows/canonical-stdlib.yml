name: Canonical stdlib byte identity (not guest execution)
on:
  pull_request:
    paths:
      - 'stdlib/**/*.atto'
      - 'tests/byte_buffer_reference.rs'
      - 'tests/byte_buffer_source_contract.test.mjs'
      - 'tests/alloc_core_std_source.test.mjs'
      - 'native/**'
      - 'contracts/owned-bytes-runtime-abi-v1.json'
      - 'docs/BYTE_BUFFER_V1_PORTING.md'
      - 'contracts/canonical-stdlib-v1.json'
      - 'src/canonical-stdlib-bytes.mjs'
      - 'tests/canonical-stdlib-bytes.test.mjs'
      - 'tests/native-future-family-v1.test.mjs'
      - 'tests/native-future-family-fixtures-v1.test.mjs'
      - 'tests/fixtures/native-future-family-v1/**'
      - 'contracts/native-future-family-v1.json'
      - 'contracts/native-future-family-guest-matrix-v1.json'
      - 'docs/NATIVE_FUTURE_FAMILY_V1.md'
      - 'docs/CANONICAL_ATTO_STDLIB.md'
      - '.github/workflows/canonical-stdlib.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  byte-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test canonical byte-copy and source ABI contracts (not guest execution)
        run: node --test tests/canonical-stdlib-bytes.test.mjs tests/byte_buffer_source_contract.test.mjs tests/alloc_core_std_source.test.mjs tests/native-future-family-v1.test.mjs tests/native-future-family-fixtures-v1.test.mjs
      - name: Rust host-only endian/range reference (NOT Atto guest)
        run: |
          rustc --version
          rustc --edition=2021 --test -D warnings tests/byte_buffer_reference.rs -o /tmp/atto-byte-buffer-reference
          /tmp/atto-byte-buffer-reference
      - name: Shared C++20 allocator host test (NOT Atto guest)
        run: |
          cmake -S native -B /tmp/atto-common-native -DATTO_COMMON_SANITIZERS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/atto-common-native --parallel 2
          ctest --test-dir /tmp/atto-common-native --output-on-failure
