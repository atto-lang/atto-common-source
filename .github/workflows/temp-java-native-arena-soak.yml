name: TEMP Java native arena exact-blob lifecycle soak
on:
  push:
    branches:
      - ci/java-native-arena-soak-20261106
permissions:
  contents: read
jobs:
  actual-jni-host-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout private exact carrier SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify upstream Java source blob identities
        env:
          EXPECTED_CARRIER: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CARRIER"
          git diff --quiet HEAD --
          python3 - <<'PY'
          import json,subprocess
          m=json.load(open("ci/java-arena/source-provenance.json"))
          for path,sha in m["source_blobs"].items():
              seen=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if seen!=sha: raise SystemExit(f"MISMATCH {path}: {seen} vs {sha}")
          print("MATCHED_SOURCE_GIT_BLOBS="+str(len(m["source_blobs"])))
          print("UPSTREAM_SOURCE_HEAD="+m["origin"]["head_sha"])
          PY
      - name: Set up JDK 25 for real JNI actor arena
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile production Java/C JNI and execute actor storage soak
        run: bash scripts/verify-actor-native-arena-soak.sh
      - name: Evidence scope
        run: |
          echo 'TRUSTED_HOST_JAVA_JNI_ONLY - no GraalVM Native Image or tenant VM was executed'
