name: Shared-domain proxy source v1
on:
  pull_request:
    paths:
      - 'contracts/v1/SHARED_DOMAIN_PROXY_SOURCE_V1.md'
      - 'contracts/v1/shared_domain_proxy_source_v1.json'
      - 'scripts/verify_shared_domain_proxy_source_v1.py'
      - 'scripts/test_shared_domain_proxy_source_v1.py'
      - '.github/workflows/shared-domain-proxy-source-v1.yml'
  push:
    paths:
      - 'contracts/v1/SHARED_DOMAIN_PROXY_SOURCE_V1.md'
      - 'contracts/v1/shared_domain_proxy_source_v1.json'
      - 'scripts/verify_shared_domain_proxy_source_v1.py'
      - 'scripts/test_shared_domain_proxy_source_v1.py'
      - '.github/workflows/shared-domain-proxy-source-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source contract blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object contracts/v1/SHARED_DOMAIN_PROXY_SOURCE_V1.md)" = "afa8e7102415a943572c030b1c5f4afb5b13e2f4"
          test "$(git hash-object contracts/v1/shared_domain_proxy_source_v1.json)" = "85fb98eb1157b5419cdb2dd8ac9437f0e5fb3a90"
          test "$(git hash-object scripts/verify_shared_domain_proxy_source_v1.py)" = "f87c51debaf3a43bb4ef1630a9b1efd2ce0c4688"
          test "$(git hash-object scripts/test_shared_domain_proxy_source_v1.py)" = "ec63469a6e5cfc541c6481e7f6b9a83d73e1ab27"
      - name: Execute 46 source-contract tests in three rounds
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m py_compile scripts/verify_shared_domain_proxy_source_v1.py scripts/test_shared_domain_proxy_source_v1.py
          python3 scripts/verify_shared_domain_proxy_source_v1.py
          python3 -I - <<'PY'
          import json, os, sys, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from test_shared_domain_proxy_source_v1 import SharedDomainProxySourceV1Test
          counts=[]
          for round_id in (1,2,3):
              suite=unittest.defaultTestLoader.loadTestsFromTestCase(SharedDomainProxySourceV1Test)
              if suite.countTestCases()!=46:
                  raise SystemExit("proxy source test inventory differs from pinned 46")
              result=unittest.TextTestRunner(verbosity=1).run(suite)
              if (result.testsRun!=46 or not result.wasSuccessful()
                      or result.skipped or result.expectedFailures or result.unexpectedSuccesses):
                  raise SystemExit("proxy source tests failed or skipped")
              counts.append(result.testsRun)
              print(f"SHARED_DOMAIN_PROXY_SOURCE_ROUND_{round_id}_PASS=46", flush=True)
          Path(os.environ["RUNNER_TEMP"],"proxy-source-rounds.json").write_text(
              json.dumps({"round_counts":counts,"executed_total":sum(counts)},sort_keys=True))
          PY
      - name: Emit bounded source-contract receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(("git",*args),text=True).strip()
          counts=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"proxy-source-rounds.json").read_text())
          if counts != {"round_counts":[46,46,46],"executed_total":138}:
              raise SystemExit("receipt inventory mismatch")
          receipt={
              "schema":"oreslang.shared_domain_proxy_source_v1",
              "repository":os.environ["GITHUB_REPOSITORY"],
              "head_sha":git("rev-parse","HEAD"),
              "tree_sha":git("rev-parse","HEAD^{tree}"),
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "round_counts":counts["round_counts"],
              "executed_total":138,
              "source_contract_only":True,
              "guest_compiler_certified":False,
              "runtime_certified":False,
              "rt_proxy_certified":False}
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"shared-domain-proxy-source-v1.json").write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          PY
      - name: Upload source-contract receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-domain-proxy-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-domain-proxy-source-v1.json
          if-no-files-found: error
          retention-days: 7
