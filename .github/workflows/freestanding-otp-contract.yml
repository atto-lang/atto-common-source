name: Freestanding core / OTP contract
on:
  pull_request:
    paths:
      - 'contracts/library/v1/library-profiles.json'
      - 'contracts/library/v1/otp-portability.json'
      - 'docs/CORE_ALLOC_ACTOR_OTP_BOUNDARY_V1.md'
      - 'tests/test_library_profiles_contract.py'
      - 'tests/test_otp_*contract.py'
      - '.github/workflows/freestanding-otp-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/library/v1/library-profiles.json'
      - 'contracts/library/v1/otp-portability.json'
      - 'docs/CORE_ALLOC_ACTOR_OTP_BOUNDARY_V1.md'
      - 'tests/test_library_profiles_contract.py'
      - 'tests/test_otp_*contract.py'
      - '.github/workflows/freestanding-otp-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate two-layer profile contract
        run: python3 tests/test_library_profiles_contract.py
      - name: Validate OTP provider and closure contracts
        run: python3 -m unittest discover -s tests -p 'test_otp_*contract.py' -v
