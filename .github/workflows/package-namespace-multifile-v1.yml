name: Multi-file package namespaces (source-free reference)

on:
  pull_request:
    paths:
      - '.github/workflows/package-namespace-multifile-v1.yml'
      - 'contracts/package-namespace-multifile-v1.json'
      - 'scripts/verify_package_namespace_multifile_contract.py'
      - 'docs/PACKAGE_NAMESPACE_MULTIFILE_IMPORTS_V1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-namespace-multifile-v1.yml'
      - 'contracts/package-namespace-multifile-v1.json'
      - 'scripts/verify_package_namespace_multifile_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source-free common-source contracts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python reference model syntax
        run: python3 -m py_compile scripts/verify_package_namespace_multifile_contract.py
      - name: Check ten-file, three-namespace reference matrix
        run: python3 scripts/verify_package_namespace_multifile_contract.py
